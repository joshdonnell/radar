name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. v0.3.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: Release ${{ inputs.version }}

    steps:
      - name: Validate Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be run from main."
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure Tag Does Not Exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Commit Built Assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add --all resources/dist

          if git diff --cached --quiet; then
            echo "Built assets are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: build assets for $VERSION"
          git push origin HEAD:main

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --target "$(git rev-parse HEAD)" --title "$VERSION" --generate-notes
